# Met en ligne la version web (dossier www/) sur GitHub Pages à chaque envoi sur la branche main
# qui touche la partie web. Adresse : https://sohhka.github.io/sohri/
name: Version web

on:
  push:
    branches: [main]
    paths:
      - 'www/**'
      - 'tools/build-web.js'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Préparer la version web (fichiers hors connexion)
        run: node tools/build-web.js
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
